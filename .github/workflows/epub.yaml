name: Create Epub

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # Runs at 00:00 on the 1st day of every month

permissions:
  contents: write

concurrency:
  group: create-epub
  cancel-in-progress: false

jobs:
    build_pages:
        name: Create Epub
        runs-on: ubuntu-latest
        env:
            ANT_OPTS: -Xmx6g
        steps:
          - name: Perform Checkout
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.x'

          - name: Fetch data
            run: |
                ./fetch-data.sh
          - name: Remove files that are not approved
            run: |
                python3 ./remove-unapproved-files.py
          - name: Extract correspondence mapping
            run: |
                python3 ./extract-correspondences.py
          - name: Prepare files for Epub
            run: |
                ant -f ./editions-to-epub.xml
          - name: Remove empty namespace declarations
            run: |
                python3 ./remove-empty-namespace-declarations.py
          - name: Remove TEI files
            run: |
                python3 ./remove-tei-files.py
          - name: Fix internal links
            run: |
                python3 ./fix-internal-links.py
          - name: Create TOCs for the Epub
            run: |
                ant -f ./create-tocs.xml
          - name: Create Epub
            run: |
                mkdir -p out
                rm -f out/schnitzler-briefe.epub
                zip -X0 out/schnitzler-briefe.epub mimetype
                zip -rX9 out/schnitzler-briefe.epub META-INF/ OEBPS/ -x "*.DS_Store"
          - name: Create Epubs per correspondence
            run: |
                python3 ./create-correspondence-epubs.py
          - name: Validate Epub
            continue-on-error: true
            run: |
                java -jar ./epubcheck.jar ./out/schnitzler-briefe.epub
          - name: Commit and Push
            uses: stefanzweifel/git-auto-commit-action@v5
            with:
                commit_message: Generated new Epub
          - name: Publish Epubs as release
            env:
                GH_TOKEN: ${{ github.token }}
            run: |
                gh release delete latest --cleanup-tag --yes || true
                gh release create latest \
                    --title "Schnitzler-Briefe EPUBs ($(date +%Y-%m-%d))" \
                    --notes "Automatisch erzeugte E-Books: Gesamtausgabe sowie ein EPUB je Korrespondenz." \
                    out/schnitzler-briefe.epub out/korrespondenzen/*.epub
